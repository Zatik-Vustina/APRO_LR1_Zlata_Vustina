name: LR6 Telegram independent check

on:
  push:
    branches: [LR6]

permissions:
  contents: read

jobs:
  verify:
    name: Check notification logic (no Unity)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run Telegram HTTP simulation
        shell: bash
        run: |
          mkdir -p evidence
          python3 -m unittest discover -s .github/scripts -p test_telegram_notify.py -v 2>&1 | tee evidence/telegram-mock-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lr6-telegram-mock-tests
          path: evidence/telegram-mock-tests.log

  live_check:
    name: Send two labelled Telegram check messages
    needs: verify
    if: ${{ github.repository == 'Zatik-Vustina/APRO_LR1_Zlata_Vustina' && vars.LR6_TELEGRAM_LIVE_CHECK == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Send simulated success and Unity failure
        shell: bash
        env:
          TELEGRAM_CHECK: '1'
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          NEEDS_JSON='{"sanity_check":{"result":"success"},"run_tests":{"result":"success"},"mirror_repo":{"result":"success"},"build_docker_image":{"result":"success"}}' python3 .github/scripts/telegram_notify.py
          NEEDS_JSON='{"sanity_check":{"result":"success"},"run_tests":{"result":"failure"},"mirror_repo":{"result":"skipped"},"build_docker_image":{"result":"skipped"}}' python3 .github/scripts/telegram_notify.py
