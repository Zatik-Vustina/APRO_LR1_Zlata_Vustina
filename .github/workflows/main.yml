name: Unity 2D Platformer CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  sanity_check:
    name: Sanity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Unity directories
        run: |
          echo "=== Проверка структуры Unity ==="
          for dir in Assets Packages ProjectSettings; do
            if [ -d "$dir" ]; then
              echo "Найдена папка: $dir"
            else
              echo "ОШИБКА: папка $dir не найдена"
              exit 1
            fi
          done

      - name: Locate expected C# scripts
        run: |
          echo "=== Поиск C#-скриптов ==="
          test -n "$(find Assets -type f -name '*Controller.cs' -print -quit)"
          test -f Assets/Editor/BuildManager.cs
          find Assets -type f -name '*Controller.cs' -print
          printf '%s\n' Assets/Editor/BuildManager.cs

  run_tests:
    name: Run Unity tests
    needs: sanity_check
    if: github.repository == 'Zatik-Vustina/APRO_LR1_Zlata_Vustina'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      UNITY_VERSION: 6000.3.10f1
      GAMECI_VERSION: v0.1.72
    steps:
      - uses: actions/checkout@v4

      - name: Verify Unity version and configure licensing
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          mkdir -p artifacts
          grep -Fx "m_EditorVersion: $UNITY_VERSION" ProjectSettings/ProjectVersion.txt
          for secret in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!secret}" ]; then
              printf 'Missing GitHub Actions secret: %s\n' "$secret" | tee -a artifacts/activation.log
            fi
          done
          test ! -s artifacts/activation.log
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          # Stop before GameCI can interpret malformed input as a path.
          try:
              root = ET.fromstring(os.environ["UNITY_LICENSE"].lstrip("\ufeff \t\n\r"))
              if root.tag.lower() != "root":
                  raise ValueError
          except (ET.ParseError, ValueError):
              message = "UNITY_LICENSE must contain the XML of an activated Unity .ulf file."
              Path("artifacts/activation.log").write_text(message + "\n", encoding="utf-8")
              raise SystemExit(message) from None
          PY

      - uses: actions/cache@v4
        with:
          path: Library
          key: Unity-Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/packages-lock.json', 'Assets/**/*.asmdef', 'ProjectSettings/**') }}

      - name: Install GameCI CLI
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/game-ci/cli/releases/download/$GAMECI_VERSION/game-ci-linux-x64.tar.gz" \
            --output "$RUNNER_TEMP/game-ci.tar.gz"
          printf '%s  %s\n' '1de550a620ee92e05e920b6db7d431621440b60b2577f04b4a997dc92a58cb0a' "$RUNNER_TEMP/game-ci.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/game-ci.tar.gz" -C "$RUNNER_TEMP" ./game-ci

      - name: Run EditMode and PlayMode tests
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          "$RUNNER_TEMP/game-ci" test --docker --dockerShmSize=1025m \
            --engine=unity --testPlatforms='playmode;editmode;COMBINE_RESULTS' \
            --engineVersion="$UNITY_VERSION" --coverageEnabled=false \
            --artifactsPath=artifacts --dockerIsolationMode=default \
            --containerRegistryRepository=unityci/editor --containerRegistryImageVersion=3 \
            2>&1 | tee artifacts/gameci.log

      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/
          if-no-files-found: warn

  mirror_repo:
    name: Mirror to backup repository
    needs: run_tests
    if: github.event_name == 'push' && github.repository == 'Zatik-Vustina/APRO_LR1_Zlata_Vustina'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify backup token exists
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          if [ -z "$BACKUP_TOKEN" ]; then
            echo "ОШИБКА: секрет BACKUP_TOKEN не задан"
            exit 1
          fi
          echo "Секрет BACKUP_TOKEN задан"

      - name: Push to backup repository
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          git remote add backup "https://x-access-token:${BACKUP_TOKEN}@github.com/Zatik-Vustina/APRO_LR1_Zlata_Vustina_backup.git"
          # Checkout fetches other branches into refs/remotes/origin.
          refs=(HEAD:refs/heads/main)
          while IFS= read -r ref; do
            branch=${ref#refs/remotes/origin/}
            if [[ "$branch" != HEAD && "$branch" != main ]]; then
              refs+=("$ref:refs/heads/$branch")
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin/)
          git push --atomic --tags backup "${refs[@]}"

  build_docker_image:
    name: Build Docker image
    needs: run_tests
    if: github.repository == 'Zatik-Vustina/APRO_LR1_Zlata_Vustina'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Prepare WebGL placeholders
        run: |
          mkdir -p Builds/WebGL/Build
          printf '<!doctype html><title>LR3</title><h1>LR3 WebGL placeholder</h1>\n' > Builds/WebGL/index.html
          printf '// LR3 placeholder\n' | gzip -n > Builds/WebGL/Build/game.framework.js.gz
          printf '' | gzip -n > Builds/WebGL/Build/game.wasm.gz
          printf '' | gzip -n > Builds/WebGL/Build/game.data.gz

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image and publish on main
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ghcr.io/zatik-vustina/platformer-game:latest
            ghcr.io/zatik-vustina/platformer-game:${{ github.sha }}
